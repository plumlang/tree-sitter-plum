[package]
authors = [ "Elixpo and the Plumlang contributors <hello@elixpo.com>" ]
autoexamples = false
categories = [ "parser-implementations", "parsing", "text-editors" ]
description = "Tree-sitter grammar for Plumlang"
edition = "2024"
keywords = [ "incremental", "parsing", "tree-sitter", "plum", "plumlang" ]
license = "MIT"
name = "tree-sitter-plum"
readme = "README.md"
repository = "https://github.com/plumlang/tree-sitter-plum"
homepage = "https://plum.elixpo.com"
documentation = "https://plum.elixpo.com/docs/"
version = "0.1.0"

build = "bindings/rust/build.rs"
include = [ "bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json", "/LICENSE" ]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.2"
